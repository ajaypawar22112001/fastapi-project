services:
  fastapi-server:
    build: .
    container_name: fastapi-server
    restart: always
    depends_on:
      - fastapi-db
    networks:
      - fastapi-net
    expose:
      - "1140"
    ports:
      - "1140:1140"
    env_file:
      - path: .env
        required: true
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - PG_DATABASE_URL=${PG_DATABASE_URL}

  fastapi-db:
    image: postgres
    container_name: fastapi-db
    restart: always
    networks:
      - fastapi-net
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    env_file:
      - path: .env
        required: true
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${PG_DB}

networks:
  fastapi-net:
    name: fastapi-net
    driver: bridge